# Optional settings to apply in the Apollo or Sunshine Web UI.
# Restrict the administration UI to the local machine.
origin_web_ui_allowed = pc
# Keep automatic router port forwarding disabled.
upnp = disabled

# Optional NVIDIA-only encoding settings. Keep automatic encoder selection
# on other GPUs. Try a higher-quality preset if the hardware has headroom.
# encoder = nvenc
# nvenc_preset = p1
# nvenc_twopass = disabled
